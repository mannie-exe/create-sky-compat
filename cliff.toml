# Conventional commit history, following empack's release workflow.
[changelog]
header = """
# Changelog

Generated from Git history. Player-facing release summaries are in [release notes](RELEASE_NOTES.md)."""
body = """

{% if version %}## {{ version }} · {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/mannie-exe/skyweave-compat/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = false
render_always = false
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
  { pattern = '\n+\z', replace = "\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^Merge ', skip = true },
  { message = '^feat', group = '<!-- 0 -->Features' },
  { message = '^fix', group = '<!-- 1 -->Fixes' },
  { message = '^perf', group = '<!-- 2 -->Performance' },
  { message = '^refactor', group = '<!-- 3 -->Refactoring' },
  { message = '^docs', group = '<!-- 4 -->Documentation' },
  { message = '^(build|ci|test)', group = '<!-- 5 -->Build and verification' },
  { message = '.*', group = '<!-- 6 -->Maintenance' },
]
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = 'oldest'
