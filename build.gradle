plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'design.inherent'
base.archivesName = 'create-sky-compat'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.architectury.dev' }
    maven {
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
}
neoForge {
    version = '21.1.264'
    runs {
        client { client(); gameDirectory = file('runs/client') }
        server { server(); gameDirectory = file('runs/server'); programArgument '--nogui' }
    }
    mods { create_sky_compat { sourceSet(sourceSets.main) } }
}
configurations {
    localRuntime
    veilSource
    aeronauticsSource
    sodiumSource
    flywheelSource
    analogSource
    runtimeClasspath.extendsFrom localRuntime
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
