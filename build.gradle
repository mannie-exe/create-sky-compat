tasks.named('test', Test) { useJUnitPlatform() }
tasks.register('verifyUpstream') {
    inputs.files(configurations.runtimeClasspath)
    inputs.files(configurations.compileClasspath)
    doLast {
        def pins = [
            'sable': '9c199157843bf953a47dff625fc5bb41c01a90538d35ad18e6996bbcb8a617c2',
            'sky-archipelago': '6bc4deeb1bc2be716d29e76837b179104009a73e9a32d6d097a415b08ac174e1',
            'sky-villages': '5ef7b63c6f1999a632085975afa14f00146369c142fd72980d760cbb617dd52f'
        ]
        pins.each { name, expected ->
            def artifact = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
                it.moduleVersion.id.group == 'maven.modrinth' && it.name == name
            }?.file
            if (artifact == null) throw new GradleException("Missing pinned ${name}")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Unexpected ${name}: ${actual}")
        }

        ['fusion-connected-textures': '29920a6838f4f942947d208349480d7f5737f9fac6411c6eac5f3e824a438048',
         'rechiseled': 'cd638bb122d7e1afce4f38b1c7da3af99be7b9f523869cfbc15e5347db5f8d9a',
         'yigd': 'dd2142a3c6a9d5b990ab36220be482f7aa9f528755f93b8fef8996f509ddcda2',
         'analog-audio': 'effc623ad0b3e332bb29252f5c41f767cb194a47ce5ae195d186f442124807a3'].each { name, expected ->
            def artifact = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
                it.moduleVersion.id.group == 'maven.modrinth' && it.name == name
            }?.file
            if (artifact == null || java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString() != expected)
                throw new GradleException("Unexpected ${name} compile-only dependency")
        }
        def jade = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'maven.modrinth' && it.name == 'jade'
        }?.file
        if (jade == null || java.security.MessageDigest.getInstance('SHA-256').digest(jade.bytes).encodeHex().toString()
