// Test released nested targets without bundling them in the output mod.
def pinnedNestedJar = { String taskName, source, String entry, String outerHash, String innerHash ->
    def output = layout.buildDirectory.file('dependencies/' + entry.tokenize('/').last())
    def extraction = tasks.register(taskName) {
        inputs.files(source)
        inputs.property 'entry', entry
        inputs.property 'outerHash', outerHash
        inputs.property 'innerHash', innerHash
        outputs.file(output)
        doLast {
            def digest = { bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
            def artifact = source.singleFile
            if (digest(artifact.bytes) != outerHash) throw new GradleException("Unexpected artifact: ${artifact.name}")
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                def bytes = zip.getInputStream(zip.getEntry(entry)).bytes
                if (digest(bytes) != innerHash) throw new GradleException("Unexpected nested artifact: ${entry}")
                output.get().asFile.parentFile.mkdirs()
                output.get().asFile.bytes = bytes
            }
        }
    }
    files(output).builtBy(extraction)
}
